<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1113">
<title>データ直行カメラ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0f1113;
    --panel: #1a1d21;
    --line: #2c3036;
    --text: #f3f4f6;
    --muted: #9aa1ab;
    --accent: #3b82f6;
    --ok: #22c55e;
    --ng: #ef4444;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans JP", system-ui, sans-serif; overscroll-behavior: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  #app { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto;
    padding-top: env(safe-area-inset-top); }

  /* 上: 送り先 */
  header { padding: 10px 12px 8px; background: var(--bg); }
  .toprow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toprow .label { font-size: 13px; color: var(--muted); }
  #openFolder { font-size: 12px; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; }
  #account { margin-left: auto; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 10px; }
  #account.in { color: var(--ok); border-color: #1f4d2f; }
  .dests { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 118px; overflow-y: auto; }
  .dest { border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    padding: 10px 4px; font-size: 15px; font-weight: 700; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .dest.add { border-style: dashed; color: var(--muted); font-weight: 400; font-size: 14px; }

  /* 新しいフォルダの窓 */
  #newFolder { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-start; justify-content: center; padding: 18vh 16px 0; }
  #newFolder[hidden] { display: none; }
  #newFolder .card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 16px 14px; }
  #newFolder p { margin: 0 0 6px; }
  #nfName { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 8px 0 4px; }
  #nfErr { min-height: 1.4em; font-size: 13px; color: #fca5a5; }
  #newFolder .row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 6px; }
  #nfCancel, #nfOk { border: 0; border-radius: 12px; padding: 14px 0; font-size: 16px; font-weight: 700; }
  #nfCancel { background: var(--bg); border: 1px solid var(--line); }
  #nfOk { background: var(--accent); }
  #nfOk:disabled { opacity: .5; }

  /* 中: ファインダー */
  #finder { position: relative; overflow: hidden; background: #000; min-height: 0; touch-action: manipulation; }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #flash.on { opacity: .7; transition: none; }
  #focusRing { position: absolute; width: 76px; height: 76px; margin: -38px 0 0 -38px; border: 2px solid #fff;
    border-radius: 50%; pointer-events: none; opacity: 0; }
  #focusRing.on { animation: focus 1.4s ease-out forwards; }
  @keyframes focus {
    0% { opacity: 1; transform: scale(1.5); border-color: #fff; }
    35% { opacity: 1; transform: scale(1); border-color: #fff; }
    70% { opacity: 1; transform: scale(1); border-color: var(--ok); }
    100% { opacity: 0; transform: scale(1); border-color: var(--ok); }
  }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px;
    color: rgba(255,255,255,.75); pointer-events: none; text-shadow: 0 1px 2px #000; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; gap: 14px; background: rgba(15,17,19,.92); }
  .overlay[hidden] { display: none; }
  .overlay p { margin: 0; line-height: 1.7; }
  .big { font-size: 17px; font-weight: 700; padding: 14px 22px; border-radius: 12px; border: 0;
    background: var(--accent); min-width: 220px; }
  .sub { font-size: 13px; color: var(--muted); }

  /* 下: 送信の状態 + 撮った写真の列 + シャッター */
  footer { background: var(--bg); padding: 8px 12px calc(14px + env(safe-area-inset-bottom)); }
  #queue { list-style: none; margin: 0 0 8px; padding: 0; display: flex; flex-direction: column; gap: 4px; min-height: 30px; }
  #queue li { display: flex; align-items: center; gap: 8px; font-size: 13px; background: var(--panel);
    border-radius: 8px; padding: 6px 10px; }
  #queue .st { font-weight: 700; white-space: nowrap; }
  #queue .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #queue .sending .st { color: var(--warn); }
  #queue .done .st { color: var(--ok); }
  #queue .failed { background: #3a1517; }
  #queue .failed .st, #queue .note .st { color: #fca5a5; }
  #queue .note .nm { color: var(--text); white-space: normal; }
  #queue .retry { border: 0; background: var(--ng); border-radius: 6px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
  #queue .msg { display: block; font-size: 12px; color: #fca5a5; white-space: normal; }
  #strip { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 8px; padding-bottom: 2px; }
  #strip[hidden] { display: none; }
  #strip .th { position: relative; flex: 0 0 auto; height: 52px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  #strip .th img { height: 100%; display: block; }
  #strip .th.blur { border-color: var(--warn); }
  .shutterrow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: relative; }
  #modeBtn { justify-self: start; border: 1px solid var(--line); background: var(--panel); border-radius: 12px;
    padding: 8px 12px; font-size: 13px; line-height: 1.3; text-align: center; min-width: 76px; }
  #modeBtn b { display: block; font-size: 15px; }
  #modeBtn.burst { background: var(--warn); border-color: var(--warn); color: #111; }
  #shutter { width: 84px; height: 84px; border-radius: 50%; border: 5px solid #fff; background: #fff;
    box-shadow: inset 0 0 0 4px var(--bg); }
  #shutter:active { transform: scale(.94); }
  #shutter:disabled { opacity: .35; }
  #batchBtn { justify-self: end; border: 0; background: var(--accent); border-radius: 12px; padding: 8px 12px;
    font-size: 13px; line-height: 1.3; font-weight: 700; min-width: 76px; }
  #batchBtn b { display: block; font-size: 18px; }
  #batchBtn[hidden] { display: none; }
  #ver { position: absolute; right: 0; bottom: -12px; font-size: 10px; color: #4b5260; }

  /* 確認画面（1枚ずつ） */
  #review { position: fixed; inset: 0; background: #000; z-index: 10; }
  #review[hidden] { display: none; }
  #review .pic { position: absolute; left: 0; right: 0; }
  #review .pic canvas, #review .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #review .pic img[hidden] { display: none; }
  .blurWarn { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--warn); color: #111;
    font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; white-space: nowrap; z-index: 1; }
  .blurWarn[hidden] { display: none; }
  #review .bar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); background: var(--bg); }
  #review .bar .to { grid-column: 1 / -1; text-align: center; font-size: 14px; color: var(--muted); }
  #review .bar .to b { color: var(--text); }
  #retake, #send { border: 0; border-radius: 14px; padding: 18px 0; font-size: 18px; font-weight: 700; }
  #retake { background: var(--panel); border: 1px solid var(--line); }
  #send { background: var(--accent); }

  /* まとめて確認（連続モード） */
  #batch { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: grid; grid-template-rows: auto 1fr auto; }
  #batch[hidden] { display: none; }
  #batch .head { padding: calc(12px + env(safe-area-inset-top)) 14px 8px; font-size: 15px; }
  #batch .head .sub { display: block; margin-top: 2px; }
  #grid { overflow-y: auto; padding: 4px 12px 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; align-content: start; }
  #grid .cell { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 3 / 4; border: 2px solid transparent; }
  #grid .cell.blur { border-color: var(--warn); }
  #grid .cell img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #grid .cell .no { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); font-size: 12px; padding: 2px 8px; border-radius: 999px; }
  #grid .cell .del { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.7); font-size: 18px; font-weight: 700; }
  #grid .cell .bw { position: absolute; left: 6px; bottom: 6px; background: var(--warn); color: #111; font-size: 12px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px; }
  #batch .bar { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; padding: 10px 12px calc(16px + env(safe-area-inset-bottom)); }
  #batch .bar .to { grid-column: 1 / -1; text-align: center; font-size: 14px; color: var(--muted); }
  #batch .bar .to b { color: var(--text); }
  #batchBack, #batchSend { border: 0; border-radius: 14px; padding: 16px 0; font-size: 17px; font-weight: 700; }
  #batchBack { background: var(--panel); border: 1px solid var(--line); }
  #batchSend { background: var(--accent); }
  #batchSend:disabled { opacity: .4; }
  #viewer { position: fixed; inset: 0; z-index: 14; background: #000; }
  #viewer[hidden] { display: none; }
  #viewer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #viewer .bar { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); background: rgba(15,17,19,.85); }
  #viewDel, #viewClose { border: 0; border-radius: 14px; padding: 16px 0; font-size: 17px; font-weight: 700; }
  #viewDel { background: #3a1517; color: #fca5a5; }
  #viewClose { background: var(--panel); border: 1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="toprow">
      <span class="label">送り先</span>
      <button id="openFolder" type="button" title="選んでいる送り先のフォルダを Google ドライブで開く">ドライブで見る</button>
      <button id="account" type="button">ログイン</button>
    </div>
    <div class="dests" id="dests"></div>
  </header>

  <div id="finder">
    <video id="video" playsinline muted autoplay></video>
    <div id="focusRing"></div>
    <div id="flash"></div>
    <div id="hint">画面を押すとピントを合わせ直します</div>
    <div class="overlay" id="camMsg" hidden></div>
    <div class="overlay" id="loginCard" hidden>
      <p><b>はじめに Google でログインしてください</b></p>
      <p class="sub">撮った写真を、あなたの Google ドライブの<br>「データ直行カメラ」フォルダへ送ります。</p>
      <button class="big" id="loginBtn" type="button">Google でログイン</button>
      <p class="sub" id="loginNote"></p>
    </div>
  </div>

  <footer>
    <ul id="queue" aria-live="polite"></ul>
    <div id="strip" hidden></div>
    <div class="shutterrow">
      <button id="modeBtn" type="button"><b>1枚ずつ</b>連続にする</button>
      <button id="shutter" type="button" aria-label="撮る" disabled></button>
      <button id="batchBtn" type="button" hidden><b id="batchCount">0</b>確認する</button>
      <span id="ver"></span>
    </div>
  </footer>
</div>

<div id="review" hidden>
  <div class="pic"><canvas id="quick"></canvas><img id="shot" alt="撮った写真" hidden><div class="blurWarn" id="reviewBlur" hidden>ピンぼけかも。撮り直しをおすすめします</div></div>
  <div class="bar">
    <div class="to">送り先: <b id="reviewDest"></b></div>
    <button id="retake" type="button">撮り直し</button>
    <button id="send" type="button">送る</button>
  </div>
</div>

<div id="batch" hidden>
  <div class="head"><b id="batchTitle"></b><span class="sub">写真を押すと大きく見られます。要らない写真は ✕ で消せます。</span></div>
  <div id="grid"></div>
  <div class="bar">
    <div class="to">送り先: <b id="batchDest"></b></div>
    <button id="batchBack" type="button">続けて撮る</button>
    <button id="batchSend" type="button">まとめて送る</button>
  </div>
</div>
<div id="viewer" hidden>
  <img id="viewImg" alt="撮った写真">
  <div class="blurWarn" id="viewBlur" hidden>ピンぼけかも</div>
  <div class="bar">
    <button id="viewDel" type="button">この写真を消す</button>
    <button id="viewClose" type="button">閉じる</button>
  </div>
</div>

<div id="newFolder" hidden>
  <div class="card">
    <p><b>新しいフォルダ</b></p>
    <p class="sub">「データ直行カメラ」の中に作って、送り先にします。</p>
    <input id="nfName" type="text" maxlength="30" placeholder="例: 町内会" autocomplete="off" enterkeyhint="done">
    <p id="nfErr"></p>
    <div class="row">
      <button id="nfCancel" type="button">やめる</button>
      <button id="nfOk" type="button">作る</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============ 設定 ============ */
const CONFIG = {
  VERSION: '0.3.0',
  // Google Cloud（プロジェクト data-chokko-camera）の OAuth クライアントID。秘密の値ではない
  CLIENT_ID: '73917303414-3d4rbe7ifl904r77kv79lq1csa7smura.apps.googleusercontent.com',
  SCOPE: 'https://www.googleapis.com/auth/drive.file',
  ROOT_NAME: 'データ直行カメラ',
  DESTS: ['未整理', '自治会', '光熱費', 'ノート'],
  DEFAULT_DEST: '未整理',
  MAX_BYTES: 4.8 * 1024 * 1024,   // Drive の multipart アップロードの上限 5MB に収める
  QUALITIES: [0.92, 0.86, 0.8, 0.72],
  BLUR_LIMIT: 150,                // ぼやけの数字がこれ未満なら「ピンぼけかも」（Xperia の写真で決めた）
  MAX_BATCH: 20,                  // 連続モードで一度に持てる枚数
  DONE_HIDE_MS: 4000,             // 「送れました」の行を消すまで
};
const KEY = { token: 'dcc.token', dest: 'dcc.dest', folders: 'dcc.folders', email: 'dcc.email', custom: 'dcc.custom', mode: 'dcc.mode' };
const FOLDER_MIME = 'application/vnd.google-apps.folder';

/* ============ 小道具 ============ */
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
}
// 日本時間で YYYY-MM-DD_HHMMSS.jpg。同じ秒に2枚あれば _2 を付ける
const usedNames = new Set();
function fileNameFor(date) {
  const j = new Date(date.getTime() + 9 * 3600 * 1000);
  const p = (n) => String(n).padStart(2, '0');
  const base = `${j.getUTCFullYear()}-${p(j.getUTCMonth() + 1)}-${p(j.getUTCDate())}_` +
               `${p(j.getUTCHours())}${p(j.getUTCMinutes())}${p(j.getUTCSeconds())}`;
  let name = base + '.jpg';
  for (let i = 2; usedNames.has(name); i++) name = `${base}_${i}.jpg`;
  usedNames.add(name);
  return name;
}
class AuthError extends Error {}
class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }

/* ============ 送り先 ============ */
// 自分で作ったフォルダ（決まった4つの後ろに並べる）。ログインのたびにドライブの一覧で読み直す
let custom = (store.get(KEY.custom) || []).filter((n) => typeof n === 'string' && n && !CONFIG.DESTS.includes(n));
const allDests = () => CONFIG.DESTS.concat(custom);
let dest = allDests().includes(store.get(KEY.dest)) ? store.get(KEY.dest) : CONFIG.DEFAULT_DEST;
function selectDest(d) { dest = d; store.set(KEY.dest, d); renderDests(); }
function renderDests() {
  const box = $('dests');
  box.innerHTML = '';
  for (const d of allDests()) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dest'; b.textContent = d; b.title = d;
    b.setAttribute('aria-pressed', String(d === dest));
    b.onclick = () => selectDest(d);
    box.appendChild(b);
  }
  const add = document.createElement('button');
  add.type = 'button'; add.className = 'dest add'; add.textContent = '＋ 追加'; add.title = '新しいフォルダを作る';
  add.onclick = openNewFolder;
  box.appendChild(add);
  const sel = box.querySelector('[aria-pressed="true"]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest' });
  if ($('batchDest')) $('batchDest').textContent = dest;
}

/* ============ 新しいフォルダ ============ */
function openNewFolder() {
  $('nfName').value = ''; $('nfErr').textContent = ''; $('nfOk').disabled = false;
  $('newFolder').hidden = false;
  setTimeout(() => $('nfName').focus(), 50);
}
function closeNewFolder() { $('newFolder').hidden = true; $('nfName').blur(); }
function folderNameError(name) {
  if (!name) return 'フォルダの名前を入れてください';
  if (name.length > 30) return '30文字までにしてください';
  if (/[\\/]/.test(name)) return '「/」は使えません';
  return '';
}
// ★ボタンを押した処理の中で呼ぶ（ログインが切れていたら、ここでログイン窓を開く）
function createFolderClicked() {
  const name = $('nfName').value.trim().replace(/\s+/g, ' ');
  const err = folderNameError(name);
  if (err) { $('nfErr').textContent = err; return; }
  if (allDests().includes(name)) { selectDest(name); closeNewFolder(); return; }   // 同じ名前があればそれを選ぶ
  $('nfOk').disabled = true; $('nfErr').textContent = '作っています…';
  getTokenInGesture()
    .then(() => addFolder(name))
    .then(() => { selectDest(name); closeNewFolder(); })
    .catch((e) => { $('nfErr').textContent = 'フォルダを作れませんでした（' + (e && e.message || e) + '）'; })
    .finally(() => { $('nfOk').disabled = false; });
}

/* ============ 送り先のフォルダをドライブで開く ============ */
const folderUrl = (id) => 'https://drive.google.com/drive/folders/' + encodeURIComponent(id);
function openFolderClicked() {
  const f = store.get(KEY.folders);
  const id = f && f.sub && f.sub[dest];
  if (id) { window.open(folderUrl(id), '_blank'); return; }
  // まだフォルダの ID を知らない（ログイン前など）: 先に窓を開けておき、ID が分かったら行き先を入れる
  const w = window.open('', '_blank');
  getTokenInGesture()
    .then(() => addFolder(dest))
    .then((fid) => { if (w) w.location.href = folderUrl(fid); else window.open(folderUrl(fid), '_blank'); })
    .catch((e) => { if (w) w.close(); showNote('フォルダを開けませんでした: ' + (e && e.message || e)); });
}

/* ============ ログイン（Google Identity Services のトークン方式） ============ */
let token = store.get(KEY.token);      // { access_token, expires_at }
let tokenClient = null;
let waiters = [];
const tokenValid = () => !!(token && token.access_token && token.expires_at - 60 * 1000 > Date.now());

function initGis() {
  if (tokenClient) return true;
  if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
  if (CONFIG.CLIENT_ID.startsWith('__')) return false;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPE,
    callback: onTokenResponse,
    error_callback: (err) => {
      const msg = err && err.type === 'popup_failed_to_open'
        ? 'ログインの窓が開けませんでした。もう一度押してください'
        : 'ログインが終わりませんでした。もう一度押してください';
      flushWaiters(new AuthError(msg));
    },
  });
  return true;
}
function onTokenResponse(resp) {
  if (!resp || resp.error) { flushWaiters(new AuthError('ログインできませんでした（' + (resp && resp.error) + '）')); return; }
  if (!google.accounts.oauth2.hasGrantedAllScopes(resp, CONFIG.SCOPE)) {
    flushWaiters(new AuthError('ドライブへの保存を許可してください（チェックを入れて続行）')); return;
  }
  token = { access_token: resp.access_token, expires_at: Date.now() + (Number(resp.expires_in) || 3600) * 1000 };
  store.set(KEY.token, token);

function flushWaiters(err) {

// ★ボタンを押した処理の中で（await の前に）呼ぶこと。ログイン窓は押した操作からしか開けない
function getTokenInGesture() {

    ? 'まだ設定中です（クライアントIDが未設定）' : 'ログインの準備中です。少し待ってもう一度押してください'));
  return new Promise((res, rej) => {

function clearToken() { token = null; store.del(KEY.token); renderAccount(); }

/* ============ Drive API ============ */
async function api(path, opts = {}) {
  if (!tokenValid()) throw new AuthError('ログインが切れました');
  const r = await fetch('https://www.googleapis.com' + path, {
    ...opts, headers: { Authorization: 'Bearer ' + token.access_token, ...(opts.headers || {}) },
  });
  if (r.status === 401) { clearToken(); throw new AuthError('ログインが切れました'); }
  if (!r.ok) {
    let msg = r.status + '';
    try { const j = await r.json(); msg += ' ' + ((j.error && j.error.message) || ''); } catch {}
    throw new ApiError(r.status, msg);
  }
  return r.status === 204 ? null : r.json();
}
const q = (s) => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function findFolder(name, parentId) {
  const query = `name='${q(name)}' and mimeType='${FOLDER_MIME}' and trashed=false and '${parentId}' in parents`;
  const r = await api('/drive/v3/files?spaces=drive&pageSize=10&orderBy=createdTime&fields=files(id,name)&q=' + encodeURIComponent(query));
  return r.files && r.files.length ? r.files[0].id : null;
}
async function createFolder(name, parentId) {
  const r = await api('/drive/v3/files?fields=id', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: FOLDER_MIME, parents: [parentId] }),
  });
  return r.id;
}
async function folderAlive(id) {
  if (!id) return false;
  try { const f = await api(`/drive/v3/files/${encodeURIComponent(id)}?fields=id,trashed`); return !f.trashed; }
  catch (e) { if (e instanceof ApiError && e.status === 404) return false; throw e; }
}
async function listFolders(parentId) {
  const query = `'${parentId}' in parents and mimeType='${FOLDER_MIME}' and trashed=false`;
  const r = await api('/drive/v3/files?spaces=drive&pageSize=200&orderBy=createdTime&fields=files(id,name)&q=' + encodeURIComponent(query));
  return r.files || [];
}
// 親フォルダ: 保存した ID → 名前で探す → 作る。中のフォルダ: 一覧で読み直し、決まった4つが無ければ作る
function ensureFolders(verify) {
  const cached = store.get(KEY.folders);
  if (!verify && cached && cached.root && CONFIG.DESTS.every((d) => cached.sub && cached.sub[d])) return Promise.resolve(cached);
  if (setupPromise) return setupPromise;
  setupPromise = (async () => {
    let f = cached && cached.root ? cached : null;
    if (!f || !(await folderAlive(f.root))) {
      const root = (await findFolder(CONFIG.ROOT_NAME, 'root')) || (await createFolder(CONFIG.ROOT_NAME, 'root'));
      f = { root, sub: {} };
    }
    const list = await listFolders(f.root);   // このアプリが作ったフォルダだけが見える（drive.file）
    const sub = {};
    for (const x of list) if (!sub[x.name]) sub[x.name] = x.id;
    for (const d of CONFIG.DESTS) if (!sub[d]) sub[d] = await createFolder(d, f.root);
    f.sub = sub;
    custom = Object.keys(sub).filter((n) => !CONFIG.DESTS.includes(n));
    store.set(KEY.custom, custom);
    store.set(KEY.folders, f);
    if (!allDests().includes(dest)) selectDest(CONFIG.DEFAULT_DEST);   // ドライブで消された送り先は外す
    else renderDests();
    return f;
  })().finally(() => { setupPromise = null; });
  return setupPromise;
}
// 名前のフォルダの ID を返す（無ければ「データ直行カメラ」の直下に作る）
async function addFolder(name) {
  const f = await ensureFolders(false);
  if (!f.sub[name]) {
    f.sub[name] = (await findFolder(name, f.root)) || (await createFolder(name, f.root));
    store.set(KEY.folders, f);
  }
  if (!CONFIG.DESTS.includes(name) && !custom.includes(name)) { custom.push(name); store.set(KEY.custom, custom); }
  return f.sub[name];
}
async function uploadJpeg(blob, name, folderId) {
  const boundary = 'dcc' + Math.random().toString(36).slice(2);
  const meta = { name, parents: [folderId], mimeType: 'image/jpeg' };
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n`,
    `--${boundary}\r\nContent-Type: image/jpeg\r\n\r\n`, blob, `\r\n--${boundary}--`,
  ]);
  return api('/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body,
  });
}

/* ============ 送信の列 ============ */
const queue = [];   // { id, blob, blobP, name, dest, state: 'sending'|'done'|'failed'|'note', msg }
let seq = 0;
function renderQueue() {
  const ul = $('queue');
  ul.innerHTML = '';
  // 失敗は全部。送信中はまとめて1行。送れた行は数秒だけ（新しい1件）
  const failed = queue.filter((it) => it.state === 'failed');
  const sending = queue.filter((it) => it.state === 'sending');
  const notes = queue.filter((it) => it.state === 'note');
  const done = queue.filter((it) => it.state === 'done').slice(0, 1);
  const rows = [...failed, ...notes];
  if (sending.length === 1) rows.push(sending[0]);
  else if (sending.length > 1) rows.push({ state: 'sending', dest: sending[0].dest, name: `${sending.length}枚を送っています` });
  rows.push(...done);
  for (const it of rows.slice(0, 5)) {
    const li = document.createElement('li');
    li.className = it.state;
    const st = document.createElement('span'); st.className = 'st';
    st.textContent = { sending: '送信中…', done: '✓ 送れました', failed: '✕ 送れませんでした', note: '！' }[it.state];
    const nm = document.createElement('span'); nm.className = 'nm';
    nm.textContent = it.state === 'note' ? it.dest : `${it.dest} / ${it.name}`;
    if (it.state === 'failed' && it.msg) {
      const m = document.createElement('span'); m.className = 'msg'; m.textContent = it.msg; nm.appendChild(m);
    }
    li.append(st, nm);
    if (it.state === 'failed') {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'retry'; b.textContent = '再送';
      b.onclick = () => startSend(it);
      li.appendChild(b);
    }
    ul.appendChild(li);
  }
}
function showNote(text) {
  const it = { id: ++seq, name: '', dest: text, state: 'note', msg: '' };
  queue.unshift(it); renderQueue();
  setTimeout(() => { const i = queue.indexOf(it); if (i >= 0) { queue.splice(i, 1); renderQueue(); } }, 8000);
}
// ★ボタンを押した処理から呼ぶ（ログインが切れていたら、ここでログイン窓を開く）
function startSend(it) {
  it.state = 'sending'; it.msg = ''; renderQueue();
  getTokenInGesture()
    .then(() => sendItem(it))
    .catch((e) => fail(it, e));
}
async function sendItem(it) {
  try {
    if (!it.blob) it.blob = await it.blobP;   // 撮影がまだなら、できあがるのを待つ
    try {
      await uploadJpeg(it.blob, it.name, await addFolder(it.dest));
    } catch (e) {
      if (!(e instanceof ApiError && e.status === 404)) throw e;
      await ensureFolders(true);   // フォルダが消されていたら作り直して1回だけやり直す
      await uploadJpeg(it.blob, it.name, await addFolder(it.dest));
    }
    it.state = 'done'; it.blob = null; it.blobP = null;
    renderQueue();
    // 送れた行は数秒で消す（撮り直したあとに前の「送れました」が残って紛らわしいため）
    setTimeout(() => { const i = queue.indexOf(it); if (i >= 0 && it.state === 'done') { queue.splice(i, 1); renderQueue(); } }, CONFIG.DONE_HIDE_MS);
  } catch (e) { fail(it, e); }
}
function fail(it, e) {
  it.state = 'failed';

    : (navigator.onLine === false ? '電波がありません。つながったら［再送］を押してください' : '理由: ' + (e && e.message || e));

}
window.addEventListener('beforeunload', (ev) => {
  const unsent = queue.some((it) => (it.blob || it.blobP) && it.state !== 'done');
  if (unsent || batch.length) { ev.preventDefault(); ev.returnValue = ''; }
});

/* ============ カメラ ============ */

/* ============ ピント ============ */
function setFocus(mode, point) {
  if (!track || !track.getCapabilities) return Promise.resolve(false);

  const c = { focusMode: mode };
  if (point && caps.pointsOfInterest) c.pointsOfInterest = [point];   // 押した場所に合わせる（対応する機種だけ）
  return track.applyConstraints({ advanced: [c] }).then(() => true).catch(() => false);
}
let focusTimer = null;
// 映像を押したら、丸い印を出してピントを合わせ直す（1回合わせてから、また合わせ続ける）

/* ============ 写真の処理 ============ */
function canvasToBlob(canvas, quality) {
  return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('JPEG にできませんでした'))), 'image/jpeg', quality));
}
// 画像を JPEG にする。rotate=true なら時計回りに90度回す。5MB 以内に収める
async function encodeJpeg(src, w, h, rotate) {
  let scale = 1;
  for (let round = 0; round < 3; round++) {
    const sw = Math.round(w * scale), sh = Math.round(h * scale);
    const c = document.createElement('canvas');
    c.width = rotate ? sh : sw; c.height = rotate ? sw : sh;
    const g = c.getContext('2d');
    if (rotate) { g.translate(c.width, 0); g.rotate(Math.PI / 2); }
    g.drawImage(src, 0, 0, sw, sh);
    for (const qv of CONFIG.QUALITIES) {
      const b = await canvasToBlob(c, qv);
      if (b.size <= CONFIG.MAX_BYTES) return b;
    }
    scale *= 0.8;
  }
  throw new Error('写真が大きすぎます');
}
// JPEG の頭だけを読んで、大きさと向きの印（EXIF Orientation）を返す。写真を丸ごと読み込まない
async function jpegInfo(blob) {
  const b = new DataView(await blob.slice(0, 256 * 1024).arrayBuffer());
  if (b.byteLength < 4 || b.getUint16(0) !== 0xFFD8) return null;
  let p = 2, orientation = 1, w = 0, h = 0;
  while (p + 4 <= b.byteLength) {
    if (b.getUint8(p) !== 0xFF) return null;
    const m = b.getUint8(p + 1), len = b.getUint16(p + 2);
    if (m === 0xE1 && p + 10 <= b.byteLength && b.getUint32(p + 4) === 0x45786966) {   // "Exif"
      const t = p + 10, le = b.getUint16(t) === 0x4949;
      const g16 = (o) => b.getUint16(o, le), g32 = (o) => b.getUint32(o, le);
      const ifd = t + g32(t + 4), n = g16(ifd);
      for (let i = 0; i < n; i++) { const e = ifd + 2 + i * 12; if (g16(e) === 0x0112) orientation = g16(e + 8); }
    } else if (m >= 0xC0 && m <= 0xCF && m !== 0xC4 && m !== 0xC8 && m !== 0xCC) {   // SOF
      h = b.getUint16(p + 5); w = b.getUint16(p + 7);
      break;
    }
    p += 2 + len;
  }
  if (!w || !h) return null;
  const swap = orientation >= 5 && orientation <= 8;   // 90度回して表示する印
  return { width: swap ? h : w, height: swap ? w : h };
}
// ぼやけの数字: 幅 480 に縮めた白黒の絵で、ラプラシアン（輪郭の強さ）のばらつきを 8×6 の区画ごとに測り、上位1割の平均
async function blurScore(blob) {
  const bmp = await createImageBitmap(blob, { resizeWidth: 480, resizeQuality: 'medium' });
  const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(bmp, 0, 0); bmp.close && bmp.close();
  const { data, width: W, height: H } = g.getImageData(0, 0, c.width, c.height);
  const gray = new Float32Array(W * H);
  for (let i = 0, j = 0; i < W * H; i++, j += 4) gray[i] = 0.299 * data[j] + 0.587 * data[j + 1] + 0.114 * data[j + 2];
  const LW = W - 2, LH = H - 2, th = Math.floor(LH / 8), tw = Math.floor(LW / 6), vals = [];
  for (let ti = 0; ti < 8; ti++) for (let tj = 0; tj < 6; tj++) {
    let s = 0, s2 = 0, n = 0;
    for (let y = ti * th; y < (ti + 1) * th; y++) {
      for (let x = tj * tw; x < (tj + 1) * tw; x++) {
        const k = (y + 1) * W + (x + 1);
        const l = gray[k - 1] + gray[k + 1] + gray[k - W] + gray[k + W] - 4 * gray[k];
        s += l; s2 += l * l; n++;
      }
    }
    vals.push(s2 / n - (s / n) * (s / n));
  }
  vals.sort((a, b) => b - a);
  const top = vals.slice(0, Math.max(1, Math.floor(vals.length / 10)));
  return top.reduce((a, b) => a + b, 0) / top.length;
}
async function capture() {
  const v = $('video');
  const portrait = v.videoHeight > v.videoWidth;
  let blob = null;
  if (imageCapture) {
    try { blob = await withTimeout(imageCapture.takePhoto(photoSettings || undefined), 10000); }
    catch { try { blob = await withTimeout(imageCapture.takePhoto(), 10000); } catch { blob = null; } }
  }
  if (blob) {
    let info = null;
    try { if (blob.type === 'image/jpeg') info = await jpegInfo(blob); } catch { info = null; }
    const rotateNeeded = (wd, ht) => wd !== ht && (ht > wd) !== portrait;
    // ふつうはここで終わり（向きが合っていて 5MB 以内なら、撮ったままを送る）
    if (info && !rotateNeeded(info.width, info.height) && blob.size <= CONFIG.MAX_BYTES) return blob;
    const bmp = await createImageBitmap(blob);
    const out = await encodeJpeg(bmp, bmp.width, bmp.height, rotateNeeded(bmp.width, bmp.height));
    bmp.close && bmp.close();

  }

// 押した瞬間の映像の1コマを canvas に写す（maxW を付けると縮める）

  canvas.width = Math.round(v.videoWidth * s); canvas.height = Math.round(v.videoHeight * s);
  canvas.getContext('2d').drawImage(v, 0, 0, canvas.width, canvas.height);
  return true;
}

/* ============ 撮る（1枚ずつ／連続） ============ */

/* --- 1枚ずつ: 確認画面 --- */
let current = null;    // { name, blobP, blob, url }
function placeReviewPic() {

  const r = $('finder').getBoundingClientRect();

}
function shootSingle() {
  const at = new Date();

    cur.blob = blob;
    if (current === cur) {   // まだ確認画面なら、きれいな写真に差し替える

    }

  current = cur;

function onRetake() { closeReview(); }
function onSend() {
  if (!current) return;
  const cur = current;
  const it = { id: ++seq, blob: cur.blob, blobP: cur.blobP, name: cur.name, dest, state: 'sending', msg: '' };
  queue.unshift(it);
  closeReview();          // すぐ次を撮れる状態に戻す
  startSend(it);          // 写真ができしだい、裏で送る
}

/* --- 連続: 撮った写真をためて、最後にまとめて確認して送る --- */
const batch = [];       // { id, name, blobP, blob, thumb（小さい絵の URL）, url, blur }
function shootBurst() {
  if (batch.length >= CONFIG.MAX_BATCH) { showNote(CONFIG.MAX_BATCH + '枚までです。［確認する］から送ってください'); return; }
  const at = new Date();
  const c = document.createElement('canvas');
  const b = { id: ++seq, name: fileNameFor(at), blob: null, url: null, thumb: null, blur: null };
  if (grabFrame(c, 240)) b.thumb = c.toDataURL('image/jpeg', 0.7);
  flash();
  b.blobP = startCapture().then((blob) => {
    b.blob = blob;
    blurScore(blob).then((s) => { b.blur = s < CONFIG.BLUR_LIMIT; renderBatch(); }).catch(() => {});
    return blob;
  });
  b.blobP.catch((e) => { removeFromBatch(b); showNote('撮影に失敗: ' + e.message); });
  batch.push(b);
  renderBatch();
}
function removeFromBatch(b) {
  const i = batch.indexOf(b);
  if (i >= 0) batch.splice(i, 1);
  if (b.url) URL.revokeObjectURL(b.url);
  renderBatch();
}
function renderBatch() {
  // 下の小さい列
  const strip = $('strip');
  strip.innerHTML = '';
  for (const b of batch) {
    const d = document.createElement('div'); d.className = 'th' + (b.blur ? ' blur' : '');
    if (b.thumb) { const im = document.createElement('img'); im.src = b.thumb; im.alt = ''; d.appendChild(im); }
    strip.appendChild(d);
  }
  strip.hidden = batch.length === 0;
  strip.scrollLeft = strip.scrollWidth;
  $('batchBtn').hidden = batch.length === 0;
  $('batchCount').textContent = batch.length + '枚';
  updateShutter();
  // まとめて確認の画面
  if ($('batch').hidden) return;
  $('batchTitle').textContent = `撮った写真 ${batch.length}枚`;
  $('batchDest').textContent = dest;
  $('batchSend').textContent = `まとめて送る（${batch.length}枚）`;
  $('batchSend').disabled = batch.length === 0;
  const grid = $('grid');
  grid.innerHTML = '';
  batch.forEach((b, i) => {
    const cell = document.createElement('div'); cell.className = 'cell' + (b.blur ? ' blur' : '');
    const im = document.createElement('img'); im.alt = `${i + 1}枚目`;
    if (b.blob && !b.url) b.url = URL.createObjectURL(b.blob);
    im.src = b.url || b.thumb || '';
    cell.appendChild(im);
    const no = document.createElement('span'); no.className = 'no'; no.textContent = String(i + 1); cell.appendChild(no);
    if (b.blur) { const w = document.createElement('span'); w.className = 'bw'; w.textContent = 'ピンぼけかも'; cell.appendChild(w); }
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', `${i + 1}枚目を消す`);
    del.onclick = (ev) => { ev.stopPropagation(); removeFromBatch(b); };
    cell.appendChild(del);
    cell.onclick = () => openViewer(b);
    grid.appendChild(cell);
  });
}
function openBatch() { $('batch').hidden = false; renderBatch(); }
function closeBatch() { $('batch').hidden = true; }
let viewing = null;
function openViewer(b) {
  viewing = b;
  if (b.blob && !b.url) b.url = URL.createObjectURL(b.blob);
  $('viewImg').src = b.url || b.thumb || '';
  $('viewBlur').hidden = !b.blur;
  $('viewer').hidden = false;
}
function closeViewer() { $('viewer').hidden = true; $('viewImg').removeAttribute('src'); viewing = null; }
function sendBatch() {
  if (!batch.length) return;
  const items = batch.splice(0, batch.length);
  for (const b of items) {
    if (b.url) URL.revokeObjectURL(b.url);
    const it = { id: ++seq, blob: b.blob, blobP: b.blobP, name: b.name, dest, state: 'sending', msg: '' };
    queue.unshift(it);
    startSend(it);   // 押した操作の中で呼ぶ（ログインが切れていたら、ここで1回だけログインの窓を開く）
  }
  closeBatch();
  renderBatch();
}

/* ============ 起動 ============ */
function boot() {
  $('ver').textContent = 'v' + CONFIG.VERSION;
  renderDests();
  renderAccount();
  renderMode();
  $('account').onclick = loginClicked;
  $('loginBtn').onclick = loginClicked;
  $('openFolder').onclick = openFolderClicked;
  $('shutter').onclick = onShutter;
  $('modeBtn').onclick = toggleMode;
  $('batchBtn').onclick = openBatch;
  $('batchBack').onclick = closeBatch;
  $('batchSend').onclick = sendBatch;
  $('viewClose').onclick = closeViewer;
  $('viewDel').onclick = () => { if (viewing) removeFromBatch(viewing); closeViewer(); };
  $('retake').onclick = onRetake;
  $('send').onclick = onSend;
  $('finder').addEventListener('click', onFinderTap);
  $('nfOk').onclick = createFolderClicked;
  $('nfCancel').onclick = closeNewFolder;
  $('nfName').addEventListener('input', () => { $('nfErr').textContent = ''; });
  $('nfName').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); createFolderClicked(); } });
  $('newFolder').addEventListener('click', (ev) => { if (ev.target === $('newFolder')) closeNewFolder(); });
  if (CONFIG.CLIENT_ID.startsWith('__')) $('loginNote').textContent = 'まだ設定中です（クライアントIDが未設定）';
  // GIS の読み込みを待って準備しておく（押したときにすぐ窓を開けるように）
  (async () => { for (let i = 0; i < 100 && !initGis(); i++) await sleep(100); })();
  if (tokenValid()) afterLogin();
  setInterval(renderAccount, 30 * 1000);
  startCamera();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopCamera();
    else if ($('review').hidden) startCamera();
  });
}
boot();
</script>
